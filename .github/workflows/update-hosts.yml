name: Update selected hosts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build.py
      - requirements.txt
      - .github/workflows/update-hosts.yml
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r requirements.txt
      - run: python3 build.py
      - name: Commit updated hosts
        run: |
          if ! git diff --quiet -- hosts hosts-windows; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add hosts hosts-windows
            git commit -m "Update selected hosts"
            git push
          fi
